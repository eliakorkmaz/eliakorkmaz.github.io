<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Support - Elia Korkmaz</title>
    <meta name="description" content="Get help and support for apps developed by Elia Korkmaz for Apple Watch.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a0a1a 100%);
            color: #fff;
            padding: 20px;
        }

        .support-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 20px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #007AFF, #5AC8FA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .email-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #007AFF, #5856D6);
            color: #fff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 16px rgba(0, 122, 255, 0.3);
        }

        .email-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 122, 255, 0.45);
        }

        .email-link:active {
            transform: translateY(0);
        }

        .response-time {
            margin-top: 24px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
        }

        .response-time span {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }

        .back-link {
            display: inline-block;
            margin-top: 28px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 480px) {
            .support-card {
                padding: 36px 24px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="support-card">
        <div class="icon">⌚</div>
        <h1>App Support</h1>
        <p class="subtitle">If you need help with any of our apps, we're here for you.</p>
        <a href="mailto:emrahkrkmz1@gmail.com" class="email-link">
            ✉️ emrahkrkmz1@gmail.com
        </a>
        <p class="response-time">We usually respond within <span>48 hours</span>.</p>
        <a href="/privacy" class="back-link">← Privacy Policy</a>
    </div>
</body>

</html>
